name: Release

# Pushing a tag such as v2.0.0 runs the tests, builds the exe and publishes it as a GitHub release.
# The release step comes last, so a failed check or build publishes nothing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the program's version
        shell: pwsh
        run: |
          $version = (Select-String -Path mhodecode/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in mhodecode/__init__.py"
              exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run the tests and build the exe
        shell: pwsh
        run: .\build.ps1

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/MHO900LogicAnalyzer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
